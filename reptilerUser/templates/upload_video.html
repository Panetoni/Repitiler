<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enviar Novo Vídeo</title>
</head>
<body>
<h1>Enviar Novo Vídeo</h1>

{% if messages %}
  <ul>
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Enviar Vídeo</button>
</form>

<p><a href="{% url 'dashboard' %}">⬅ Voltar para Dashboard</a></p>
</body>
</html>
