<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>

    {% if messages %}
      <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <!-- Link para recuperação de senha -->
    <p>
        <a href="{% url 'password_reset_request' %}">Esqueci minha senha</a>
    </p>

    {% load socialaccount %}
    <!-- Login social com Google -->
    <p>
        <a href="{% provider_login_url 'google' process='login' %}?next=/dashboard/">
            Entrar com Google
        </a>
    </p>

    <p>Não tem uma conta? <a href="{% url 'register' %}">Registre-se aqui</a>.</p>
</body>
</html>
